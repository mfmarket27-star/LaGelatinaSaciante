<script>
    const YOUTUBE_VIDEO_ID = "eEdhpQqDnyI";
    const SHOW_OFFER_AT = 298;

    let player;
    let offerShown = false;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: YOUTUBE_VIDEO_ID,
            playerVars: {
                controls: 0,
                rel: 0,
                fs: 0,
                playsinline: 1
            },
            events: {
                onStateChange: onPlayerStateChange
            }
        });
    }

    function playVideo() {
        player.playVideo();
        document.querySelector('.play-overlay').style.display = 'none';
        setInterval(checkTime, 500);
    }

    function checkTime() {
        if (!offerShown && player.getCurrentTime() >= SHOW_OFFER_AT) {
            document.getElementById('offer-section').style.display = 'block';
            offerShown = true;
        }
    }

    function onPlayerStateChange(event) {}

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
</script>
