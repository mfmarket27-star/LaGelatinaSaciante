<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>La Gelatina Saciante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9f8;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 16px;
      font-weight: normal;
      color: #555;
      margin-bottom: 20px;
    }

    /* VIDEO SHORT */
    .video-box {
      position: relative;
      width: 100%;
      padding-top: 177.77%;
      background: #000;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }

    .video-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* OVERLAY PARA BLOQUEAR INTERACCIÓN */
    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: transparent;
    }

    /* BARRA DE PROGRESO */
    .progress-container {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      transition: width 0.4s linear;
    }

    /* OFERTA */
    .offer {
      display: none;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    .price-old {
      text-decoration: line-through;
      color: #999;
      font-size: 16px;
    }

    .price-new {
      font-size: 32px;
      color: #15803d;
      font-weight: bold;
      margin: 10px 0;
    }

    .cta-button {
      display: inline-block;
      margin-top: 15px;
      padding: 15px 30px;
      background: #15803d;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      border-radius: 8px;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>La Gelatina Saciante</h1>
  <h2>El sencillo secreto que está ayudando a muchas personas a perder peso sin gimnasio ni dietas estrictas.</h2>

  <div class="video-box">
    <iframe
      src="https://www.youtube.com/embed/7xnYhf2vbTE?autoplay=1&mute=0&controls=0&disablekb=1&modestbranding=1&rel=0&playsinline=1&start=1"
      frameborder="0"
      allow="autoplay; encrypted-media">
    </iframe>
    <div class="video-overlay"></div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="offer" id="offer">
    <h2>Acceso especial</h2>
    <p class="price-old">Antes: 47 $</p>
    <p class="price-new">Ahora: 17 $</p>

    <a class="cta-button" href="https://pay.hotmart.com/F104176785O" target="_blank">
      Quiero descubrir el secreto
    </a>
  </div>

  <footer>
    <p>Este contenido es informativo y no sustituye asesoramiento médico.</p>
    <p>© 2026 La Gelatina Saciante</p>
  </footer>

</div>

<script>
  const videoDuration = 460; // duración real en segundos
  const progressBar = document.getElementById("progressBar");
  const offer = document.getElementById("offer");

  let elapsed = 0;

  const timer = setInterval(() => {
    elapsed++;
    const percent = (elapsed / videoDuration) * 100;
    progressBar.style.width = percent + "%";

    if (elapsed >= videoDuration) {
      clearInterval(timer);
      offer.style.display = "block";
    }
  }, 1000);
</script>

</body>
</html>
