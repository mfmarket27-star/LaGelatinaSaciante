<script>
    const YOUTUBE_VIDEO_ID = "7xnYhf2vbTE";
    const DURATION = 460;

    const STORAGE_KEY = 'la_gelatina_saciante_progress';

    let player, interval, offerRevealed = false;
    const progressBar = document.getElementById('fakeProgressBar');
    const offerSection = document.getElementById('offer-section');
    const shield = document.getElementById('clickShield');

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
            videoId: YOUTUBE_VIDEO_ID,
            playerVars: {
                controls: 0,
                disablekb: 1,
                fs: 0,
                rel: 0,
                modestbranding: 1,
                playsinline: 1
            },
            events: {
                onReady: e => {
                    e.target.playVideo();
                    e.target.unMute();
                    shield.style.display = 'block';
                    startTimer();
                },
                onStateChange: e => {
                    if (e.data === YT.PlayerState.PAUSED) {
                        e.target.playVideo();
                    }
                }
            }
        });
    };

    function startTimer() {
        let elapsed = 0;
        interval = setInterval(() => {
            elapsed++;
            progressBar.style.width = (elapsed / DURATION) * 100 + "%";
            if (elapsed >= DURATION && !offerRevealed) {
                offerRevealed = true;
                offerSection.style.display = 'block';
                clearInterval(interval);
            }
        }, 1000);
    }
</script>
