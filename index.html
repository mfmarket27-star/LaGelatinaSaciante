<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Gelatina Saciante</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background:#fff;
  font-family: Arial, sans-serif;
}

.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 400px;
  margin: 30px auto;
  padding-bottom: 177.77%;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
}

#player {
  position:absolute;
  inset:0;
}

.overlay-start {
  position:absolute;
  inset:0;
  z-index:20;
  background: rgba(0,0,0,0.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  cursor:pointer;
}

.play-btn {
  width:90px;
  height:90px;
  background:#ef4444;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  margin-bottom:12px;
}

.countdown {
  font-size:48px;
  font-weight:bold;
}

.progress-container {
  max-width:400px;
  margin:auto;
  height:14px;
  background:#e5e7eb;
  border-radius:0 0 16px 16px;
  overflow:hidden;
}

.progress-bar {
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#16a34a,#22c55e);
}

.offer {
  display:none;
  max-width:400px;
  margin:30px auto;
  padding:20px;
  background:#ecfdf5;
  border-radius:16px;
  text-align:center;
}
</style>
</head>

<body>

<div class="video-wrapper">

  <div id="player"></div>

  <!-- OVERLAY INICIAL -->
  <div id="startOverlay" class="overlay-start">
    <div class="play-btn">▶</div>
    <div class="text-xl font-bold">VER VÍDEO</div>
    <div class="text-sm mt-1">🔊 Audio activado</div>
  </div>

  <!-- OVERLAY COUNTDOWN -->
  <div id="countOverlay" class="overlay-start hidden">
    <div class="countdown" id="countNum">10</div>
    <div class="mt-2 text-sm">Preparando vídeo…</div>
  </div>

</div>

<div class="progress-container">
  <div id="progressBar" class="progress-bar"></div>
</div>

<div class="offer" id="offer">
  <h2 class="text-2xl font-bold mb-2">Acceso especial</h2>
  <p class="line-through text-gray-500">$47</p>
  <p class="text-4xl font-bold text-green-600 mb-4">$17</p>
  <a href="https://pay.hotmart.com/F104176785O"
     class="bg-green-600 text-white py-4 px-6 rounded-xl text-lg block">
    Acceder ahora
  </a>
</div>

<script>
let player;
const DURATION = 460;
let elapsed = 0;

const startOverlay = document.getElementById("startOverlay");
const countOverlay = document.getElementById("countOverlay");
const countNum = document.getElementById("countNum");
const progressBar = document.getElementById("progressBar");
const offer = document.getElementById("offer");

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('player', {
    videoId: '7xnYhf2vbTE',
    playerVars: {
      controls:0,
      disablekb:1,
      rel:0,
      modestbranding:1,
      playsinline:1
    }
  });
};

startOverlay.onclick = () => {
  startOverlay.classList.add("hidden");
  countOverlay.classList.remove("hidden");

  let c = 10;
  countNum.textContent = c;

  const countdown = setInterval(() => {
    c--;
    countNum.textContent = c;
    if (c <= 0) {
      clearInterval(countdown);
      countOverlay.classList.add("hidden");
      startVideo();
    }
  }, 1000);
};

function startVideo() {
  player.playVideo();
  player.unMute();

  setInterval(() => {
    elapsed++;
    progressBar.style.width = (elapsed / DURATION) * 100 + "%";
    if (elapsed >= DURATION) {
      offer.style.display = "block";
    }
  }, 1000);
}
</script>

</body>
</html>
