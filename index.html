    </div>

</main>

<script>
    const VIDEO_ID = "eEdhpQqDnyI";
    const TARGET_TIME = 298;
    let player, interval, offerShown = false;

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: VIDEO_ID,
            playerVars: {controls: 0, fs: 0},
            events: {
                onStateChange: onStateChange
            }
        });
    }

    function playVideo() {
        player.playVideo();
        document.getElementById('startOverlay').style.display = 'none';
        startProgress();
    }

    function startProgress() {
        interval = setInterval(() => {
            const current = player.getCurrentTime();
            const percent = (current / TARGET_TIME) * 100;
            document.getElementById('progressBar').style.width = percent + "%";

            if (current >= TARGET_TIME && !offerShown) {
                offerShown = true;
                document.getElementById('offer-section').style.display = 'block';
            }
        }, 500);
    }

    function onStateChange(e) {
        if (e.data === YT.PlayerState.ENDED) {
            document.getElementById('offer-section').style.display = 'block';
        }
    }
</script>
