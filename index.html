    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%;
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .click-shield {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            cursor: pointer;
        }

        .play-icon {
            font-size: 80px;
            color: white;
            background-color: #ef4444;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-red 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); }
            70% { transform: scale(1); }
            100% { transform: scale(0.95); }
        }

        .progress-container {
            width: 100%;
            height: 16px;
            background: #e5e7eb;
            border-radius: 0 0 12px 12px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e20b0b, #ed0808);
            transition: width 0.2s ease-out;
        }

<body class="min-h-screen flex flex-col items-center">

<main class="w-full max-w-[400px] mt-6">
    <div class="video-wrapper">
        <div id="startOverlay" class="play-overlay" onclick="playVideo()">
            <div class="play-icon">
                <i class="fas fa-play"></i>
            </div>
            <p class="text-white font-bold text-xl">SUBE EL VOLUMEN</p>
        </div>
        <div id="clickShield" class="click-shield"></div>
        <div id="player"></div>
    </div>

    <div class="progress-container">
        <div id="fakeProgressBar" class="progress-bar"></div>
    </div>
</main>

<script>
const YOUTUBE_VIDEO_ID = "eEdhpQqDnyI";
let player, interval;

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: {
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            playsinline: 1
        },
        events: {
            onStateChange: onPlayerStateChange
        }
    });
}

function playVideo() {
    player.playVideo();
    player.unMute();
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('clickShield').style.display = 'block';
    startProgress();
}

function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PAUSED) {
        player.playVideo();
    }
}

function startProgress() {
    interval = setInterval(() => {
        const current = player.getCurrentTime();
        const duration = player.getDuration() || 1;
        const ratio = current / duration;
        const visualPercentage = Math.pow(ratio, 0.7) * 100;

        document.getElementById('fakeProgressBar').style.width =
            visualPercentage + "%";
    }, 500);
}
</script>
