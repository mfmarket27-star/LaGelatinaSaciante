  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gelatina Que Te Hará Bajar De Peso</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: #fff;
            color: #333;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%;
            height: 0;
            overflow: hidden;
            border-radius: 14px;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .play {
            width: 90px;
            height: 90px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 38px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {transform: scale(.95)}
            70% {transform: scale(1)}
            100% {transform: scale(.95)}
        }

        .cta {
            background: linear-gradient(to bottom,#16a34a,#15803d);
            border-bottom: 5px solid #14532d;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center px-4">

<header class="text-center mt-6">
    <h1 class="text-3xl font-bold">
        LA <span class="text-red-600">GELATINA</span> QUE TE HARÁ <span class="text-red-600">BAJAR DE PESO</span>
    </h1>
    <p class="mt-2 text-gray-600">Mira el vídeo y en solo 8 minutos lo entenderás todo.</p>
</header>

<main class="w-full max-w-md mt-6">

    <!-- VIDEO -->
    <div class="video-wrapper">
        <div id="overlay" class="overlay" onclick="playVideo()">
            <div class="play">
                <i class="fas fa-play"></i>
            </div>
        </div>

        <!-- 🔴 ESTE ES EL VÍDEO CORRECTO -->
        <iframe
            id="video"
            src="https://www.youtube.com/embed/7xnYhf2vbTE?enablejsapi=1&rel=0&modestbranding=1"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>

    <!-- OFERTA -->
    <div id="offer" class="hidden mt-8 bg-blue-50 p-6 rounded-xl text-center shadow-xl">
        <h2 class="text-2xl font-black mb-4">¡Oferta Especial!</h2>

        <p class="text-gray-500 mb-2">
            Precio habitual <span class="line-through">$50</span>
        </p>

        <div class="text-5xl font-black text-blue-700 mb-4">$14</div>

        <a href="https://pay.hotmart.com/F104176785O"
           target="_blank"
           class="cta block text-white font-extrabold text-xl py-5 rounded-xl">
            ACCESO AL CONTENIDO
        </a>

        <p class="text-sm text-gray-500 mt-3">Pago seguro · Acceso inmediato</p>
    </div>

</main>

<script>
    function playVideo() {
        const iframe = document.getElementById('video');
        iframe.src += "&autoplay=1";
        document.getElementById('overlay').style.display = "none";

        // muestra oferta a los 5 min (ajusta si quieres)
        setTimeout(() => {
            document.getElementById('offer').classList.remove('hidden');
            document.getElementById('offer').scrollIntoView({behavior:'smooth'});
        }, 300000);
    }
</script>

</body>
</html>
